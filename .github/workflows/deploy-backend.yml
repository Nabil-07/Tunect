# Production backend deploy — runs ONLY on pushes to the prod branch.
# Always checks out and deploys code from prod (never main).
#
# GitHub secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST, EC2_USER, EC2_SSH_KEY

name: Deploy Backend to EC2

env:
  DEPLOY_BRANCH: prod
  EC2_APP_DIR: Tunect/backend

on:
  push:
    branches: [prod]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest
    # Only run when the event is on prod (push) or manual deploy of prod code
    if: github.ref == 'refs/heads/prod' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Validate GitHub secrets
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Add secrets at: GitHub repo → Settings → Secrets and variables → Actions"
            exit 1
          fi
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

      - name: Checkout prod branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Configure SSH key
        run: |
          set -euo pipefail
          HOST="$(printf '%s' "$EC2_HOST" | tr -d '[:space:]')"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          install -m 600 /dev/null ec2_key
          printf '%s\n' "$EC2_SSH_KEY" > ec2_key
          chmod 600 ec2_key

          # EC2 presents ED25519; keyscan must succeed or rsync fails with "Host key verification failed"
          ssh-keyscan -T 20 -t ed25519,ecdsa,rsa -H "$HOST" >> ~/.ssh/known_hosts
          if ! ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
            echo "::error::ssh-keyscan did not add a host key for $HOST (check EC2_HOST secret and port 22)"
            exit 1
          fi
          echo "SSH_OPTS=-i ec2_key -o UserKnownHostsFile=${HOME}/.ssh/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          echo "EC2_HOST=$HOST" >> "$GITHUB_ENV"
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Sync backend to EC2
        env:
          EC2_HOST: ${{ env.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ env.EC2_APP_DIR }}
        run: |
          set -euo pipefail
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.git' \
            --exclude 'coverage' \
            --exclude 'test' \
            --exclude '*.log' \
            -e "ssh ${SSH_OPTS}" \
            ./backend/ "${EC2_USER}@${EC2_HOST}:~/${EC2_APP_DIR}/"

      - name: Install, build, migrate, and restart
        env:
          EC2_HOST: ${{ env.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ env.EC2_APP_DIR }}
        run: |
          ssh ${SSH_OPTS} "${EC2_USER}@${EC2_HOST}" \
            "EC2_APP_DIR=${EC2_APP_DIR}" bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/"${EC2_APP_DIR}"

          if [ ! -f .env ]; then
            echo "ERROR: ~/${EC2_APP_DIR}/.env is missing. Copy it once with scp (see DEPLOY_BACKEND.md)."
            exit 1
          fi

          export NODE_ENV=production
          npm ci
          npm run build
          npx prisma migrate deploy

          if pm2 describe tunect-backend >/dev/null 2>&1; then
            pm2 restart tunect-backend --update-env
          else
            pm2 start dist/src/main.js --name tunect-backend --time
          fi
          pm2 save
          REMOTE

      - name: Verify deployment
        env:
          EC2_HOST: ${{ env.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh ${SSH_OPTS} "${EC2_USER}@${EC2_HOST}" \
            "pm2 list && pm2 describe tunect-backend | head -20"

      - name: Remove SSH key
        if: always()
        run: rm -f ec2_key
