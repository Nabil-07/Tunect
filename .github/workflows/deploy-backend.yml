# Production backend deploy — prod branch only.
# Job 1: build on GitHub (full devDependencies).
# Job 2: rsync dist + runtime install on EC2 (no nest build on server).
#
# Secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY

name: Deploy Backend to EC2

env:
  DEPLOY_BRANCH: prod
  EC2_APP_DIR: Tunect/backend

on:
  push:
    branches: [prod]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: true

jobs:
  build:
    name: Build backend (GitHub)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout prod branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install and compile
        working-directory: backend
        env:
          # prisma generate only needs a valid URL shape on CI
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
        run: |
          npm ci
          npm run build
          test -f dist/main.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            backend/dist
            backend/package.json
            backend/package-lock.json
            backend/prisma
            backend/ecosystem.config.cjs
          retention-days: 1

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/prod' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Validate GitHub secrets
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

      - name: Checkout prod branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend

      - name: Configure SSH key
        run: |
          set -euo pipefail
          HOST="$(printf '%s' "$EC2_HOST" | tr -d '[:space:]')"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          install -m 600 /dev/null ec2_key
          printf '%s' "$EC2_SSH_KEY" | tr -d '\r' > ec2_key
          chmod 600 ec2_key
          ssh-keygen -y -f ec2_key >/dev/null
          ssh-keyscan -T 20 -t ed25519,ecdsa,rsa -H "$HOST" >> ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
          echo "SSH_OPTS=-i ec2_key -o UserKnownHostsFile=${HOME}/.ssh/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          echo "EC2_HOST=$HOST" >> "$GITHUB_ENV"
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Sync backend to EC2
        env:
          EC2_HOST: ${{ env.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ env.EC2_APP_DIR }}
        run: |
          set -euo pipefail
          test -f backend/dist/main.js
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.git' \
            --exclude 'coverage' \
            --exclude 'test' \
            --exclude 'src' \
            --exclude '*.log' \
            -e "ssh ${SSH_OPTS}" \
            ./backend/ "${EC2_USER}@${EC2_HOST}:~/${EC2_APP_DIR}/"

      - name: Install runtime deps, migrate, restart (no build on EC2)
        env:
          EC2_HOST: ${{ env.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ env.EC2_APP_DIR }}
        run: |
          ssh ${SSH_OPTS} "${EC2_USER}@${EC2_HOST}" \
            "EC2_APP_DIR=${EC2_APP_DIR}" bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/"${EC2_APP_DIR}"
          test -f dist/main.js
          test ! -f src/main.ts || echo "WARN: src/ present; deploy should use prebuilt dist only"

          unset NODE_ENV
          npm ci --omit=dev

          set -a
          source .env
          set +a
          npx prisma migrate deploy

          # Restart is not enough: old PM2 entries often still point at dist/src/main.js.
          pm2 delete tunect-backend 2>/dev/null || true
          pm2 start ecosystem.config.cjs --only tunect-backend
          pm2 save
          sleep 3
          curl -fsS http://127.0.0.1:${PORT:-3000}/health >/dev/null
          REMOTE

      - name: Verify deployment
        env:
          EC2_HOST: ${{ env.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh ${SSH_OPTS} "${EC2_USER}@${EC2_HOST}" \
            "pm2 list && pm2 describe tunect-backend | head -25 && curl -fsS http://127.0.0.1:3000/health | head -c 200"

      - name: Remove SSH key
        if: always()
        run: rm -f ec2_key
