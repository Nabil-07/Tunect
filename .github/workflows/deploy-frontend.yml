# Deploy Frontend to S3 + CloudFront (prod only).
#
# GitHub Actions secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   CLOUDFRONT_DISTRIBUTION_ID  → EOTX0VB1WMYQ0
#   VITE_ENCRYPTION_KEY         → same as production Frontend .env
#   VITE_RAZORPAY_KEY_ID        → live key (optional if set in repo .env.prod locally only)
#
# Never commit AWS keys or live secrets to the repository.

name: Deploy Frontend to S3 + CloudFront

env:
  DEPLOY_BRANCH: prod
  AWS_REGION: ap-south-1
  S3_BUCKET: tunectnow.com
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

on:
  push:
    branches: [prod]
    paths:
      - 'Frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Frontend to S3
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Validate secrets
        run: |
          missing=0
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY CLOUDFRONT_DISTRIBUTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

      - name: Checkout prod branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install and build
        working-directory: Frontend
        env:
          VITE_API_URL: https://api.tunectnow.com
          VITE_APP_URL: https://tunectnow.com
          VITE_USE_MOCKS: 'false'
          VITE_LIVEKIT_HOST: wss://livekit.tunectnow.com
          VITE_KYC_USE_PRESIGNED_UPLOADS: 'true'
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          VITE_ENCRYPTION_KEY: ${{ secrets.VITE_ENCRYPTION_KEY }}
        run: |
          npm ci
          npm run build
          test -d dist/index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync Frontend/dist/ "s3://${S3_BUCKET}/" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
