  livekit:
    image: livekit/livekit-server:latest
    container_name: tunect_livekit
    restart: unless-stopped
    ports:
      - "7880:7880"      # HTTP/WebSocket port
      - "40000-40020:40000-40020/udp"  # RTC UDP ports (matches livekit.yaml)
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml
    networks:
      - tunect_network

networks:
  tunect_network:
    driver: bridge

